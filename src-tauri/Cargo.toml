[package]
name = "etiket-hazirlayici"
version = "26.6.0"
description = "Etiket Hazırlayıcı - Akıllı Etiket Yazdırma Aracı"
authors = ["İlyas Yeşil <Green Labs Development Technology, Inc>"]
edition = "2021"
license = "Proprietary"

[lib]
name = "etiket_hazirlayici_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.26"
regex = "1"
dirs = "6"
tauri-plugin-single-instance = "2.4.2"
encoding_rs = "0.8"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
] }
